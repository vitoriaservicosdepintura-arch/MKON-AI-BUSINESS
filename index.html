<!doctype html>
<html lang="pt-PT">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex,nofollow" />
    <title>MKON AI BUSINESS</title>
    <script>
      try {
        var t = localStorage.getItem('mkon.theme');
        if (t === 'azul' || t === 'branco' || t === 'preto' || t === 'laranja') document.documentElement.setAttribute('data-theme', t);
        else document.documentElement.setAttribute('data-theme', 'azul');
      } catch (e) { document.documentElement.setAttribute('data-theme', 'azul'); }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
